name: Test final

on:
  push:
    branches:
      - test-1244-eslint
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
   
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    - name: Setup Node.js
      # uses: actions/setup-node@v4
      # uses: fregante/setup-node@patch-1
      uses: FloEdelmann/setup-node@patch-1
      with:
        node-version: '22.14.0'
    - name: Test ESLint Compact Problem Matcher
      run: |
          echo "/home/runner/work/repo/file.ts: line 14, col 1, error - 'webext-messenger' should be listed in the project's dependencies. Run 'npm i -S webext-messenger' to add it (import/no-extraneous-dependencies)"
          echo "file.js: line 15, col 8, warning - Example warning message (rule-id)" >> output.txt


    # - run: |
    #     echo "  /home/runner/work/repo/file.ts"
    #     echo "    14:1  error  'webext-messenger' should be listed in the project's dependencies. Run 'npm i -S webext-messenger' to add it  import/no-extraneous-dependencies"
    - name: Install dependencies
      run: npm install

    