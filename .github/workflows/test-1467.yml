name: test-setup-node-mirror-token-bearer

on:
  push:
    branches:
      - test-686
  workflow_dispatch:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest, macos-15-intel, ubuntu-24.04-arm]
     
    steps:
      - uses: actions/checkout@v6
      - name: Clear hosted tool cache
        shell: bash
        run: |
          if [[ "$RUNNER_OS" == "Linux" ]]; then
            sudo rm -rf /opt/hostedtoolcache
          elif [[ "$RUNNER_OS" == "macOS" ]]; then
            sudo rm -rf /Users/runner/hostedtoolcache
          elif [[ "$RUNNER_OS" == "Windows" ]]; then
            powershell -Command "Remove-Item -Recurse -Force C:\hostedtoolcache"
          fi
      # - uses: marco-ippolito/setup-node@fix-bearer-token
      - uses: actions/setup-node@v6
        with:
          node-version: '25'
          # mirror: 'https://mirror.yandex.ru/mirrors/nodejs.org/'
          mirror: 'invalid url'
          mirror-token: ${{secrets.GITHUB_TOKEN}}
          package-manager-cache: false
      - name: Verify Node.js installation
        run: node -v    
      - run: npm i
