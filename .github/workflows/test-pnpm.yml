name: Test cache

on:
  push:
    branches:
      - test-686
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-13]
        #os: [ubuntu-latest]
        os: ['ubuntu-latest','macos-latest','windows-latest']

        # os: [self-hosted]
    runs-on: ${{ matrix.os }}
   
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Show pnpm version
        run: pnpm --version
      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
      - name: Show pnpm version
        run: pnpm --version