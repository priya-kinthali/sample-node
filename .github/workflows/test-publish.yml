    #   with:
    #     node-version: '24.x'
    #     registry-url: 'https://registry.npmjs.org'
    - run: npm ci
    # - run: npm publish
    #   env:
    #     NODE_AUTH_TOKEN: ${{secrets.NPM_TOKEN}}
    - uses: actions/setup-node@v6
      with:
        registry-url: 'https://npm.pkg.github.com'
    - run: npm publish
      env:
        NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  