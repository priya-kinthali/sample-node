name: Test publish

on:
  push:
    branches:
      - test-686
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-13]
        #os: [ubuntu-latest]
        os: ['ubuntu-latest']

        # os: [self-hosted]
    runs-on: ${{ matrix.os }}
   
    steps:
    - uses: actions/checkout@v6
