name: Test final

on:
  push:
    branches:
      - test-1244-eslint
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # os: [ubuntu-latest, windows-latest, macos-latest]
        os: [macos-latest]

    runs-on: ${{ matrix.os }}
   
    steps:
    - name: Checkout repository
      uses: actions/checkout@v4
    # - name: Setup Node.js
    #   uses: actions/setup-node@v4
    #   with:
    #     node-version: '22.14.0'
    - name: Install Node.js 22.14.0
      run: |
        curl -fsSL https://nodejs.org/dist/v22.14.0/node-v22.14.0-darwin-x64.tar.gz -o node.tar.gz
        mkdir -p $HOME/node
        tar -xzf node.tar.gz -C $HOME/node --strip-components=1
        echo "$HOME/node/bin" >> $GITHUB_PATH
        export PATH=$HOME/node/bin:$PATH
        node --version

    - name: Check npm version
      run: |
        export PATH=$HOME/node/bin:$PATH
        npm --version
    # - name: Check npm version
    #   run: npm --version
    # - name: Downgrade npm to version 8
    #   run: npm install -g npm@8
    # - name: Check npm version
    #   run: npm --version
    - name: Trigger an npm install error
      run: npm run does-not-exist


    