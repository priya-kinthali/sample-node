name: Test cache

on:
  # push:
  #   branches:
  #     - test-686
  workflow_dispatch:
jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        # os: [ubuntu-latest, ubuntu-24.04-arm, windows-latest, windows-11-arm, macos-latest, macos-13]
        #os: [ubuntu-latest]
        os: ['ubuntu-latest']

        # os: [self-hosted]
    runs-on: ${{ matrix.os }}
   
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
    # - uses: pnpm/action-setup@v5
    #   with:
    #     version: 9
          # 1. Install Nix
    - name: Install Nix
      uses: cachix/install-nix-action@v31
      with:
        nix_path: nixpkgs=channel:nixos-unstable
          # 2. Install Node.js via Nix and expose it on PATH for later steps
    - name: Install Node via Nix
      run: |
        nix profile install nixpkgs#nodejs_24
        echo "Nix node path: $(which node)"
        node -v
        # persist Nix profile bin on PATH for subsequent steps
        echo "$HOME/.nix-profile/bin" >> "$GITHUB_PATH"
          # 3. Record which Node is active BEFORE setup-node
    - name: Node before setup-node
      run: |
        echo "which node: $(which node)"
        echo "version: $(node -v)"
    - name: Setup Node.js
      uses: actions/setup-node@v7
      # uses: priyagupta108/setup-node@enable-npm-cache-default
      # uses: priya-kinthali/setup-node@final-686
      # uses: priya-kinthali/setup-node@sample-686
      # uses: priya-kinthali/setup-node@package-manager-field-caching
      with:
      #   node-version: '24'
        # cache: 'yarn'
        # package-manager-cache: false
        cache: 'npm'
        # cache-dependency-path: subdir/pnpm-lock.yaml
        # enable-package-manager-cache: true
    # - run: npm ci
      # 5. Record which Node is active AFTER setup-node
    - name: Node after setup-node
      run: |
        echo "which node: $(which node)"
        echo "version: $(node -v)"
    - name: Install dependencies
      run: npm install
    # - run: npm --version
    # - run: yarn install
    # - run: pnpm install

  