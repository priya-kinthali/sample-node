name: Test cache

on:
  push:
    branches:
      - test-686
  workflow_dispatch:
jobs:
  build_and_release2:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
            node-version: 24